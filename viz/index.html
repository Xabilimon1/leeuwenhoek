<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leeuwenhoek: argmedian h=4</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar">
    <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="modes" role="group" aria-label="Red">
      <button id="m-trained" aria-pressed="true">red entrenada</button>
      <button id="m-design" aria-pressed="false">red diseñada</button>
    </div>
    <label class="memory" id="memory" hidden>memoria <input id="b" type="range" min="0.02" max="1.5" step="0.005"></label>
  </div>

  <main>
    <section class="panel">
      <div class="tabbar"><span class="tab">tres números</span></div>
      <div class="body"><svg id="line" viewBox="0 0 340 440" aria-label="Los tres números, arrastrables"></svg></div>
    </section>

    <section class="panel">
      <div class="tabbar"><span class="tab">la red los lee uno a uno</span></div>
      <div class="body"><svg id="steps" viewBox="0 0 640 440" aria-label="Neuronas encendidas en cada paso"></svg></div>
    </section>

    <section class="panel">
      <div class="tabbar"><span class="tab">qué elige la red</span></div>
      <div class="body" style="gap:8px"><canvas id="plane" width="720" height="720" aria-label="Respuesta de la red para cada x2 y x3"></canvas></div>
    </section>

    <section class="panel">
      <div class="tabbar"><span class="tab">lupa ×25</span></div>
      <div class="body"><canvas id="loupe" width="720" height="720" aria-label="Ampliación alrededor de la entrada"></canvas></div>
    </section>
  </main>

  <div class="status" id="status"></div>

  <script src="data.js"></script>
  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
